name: Build Linux installers

on:
  push:
    branches:
      - "**"

jobs:
  build-linux:
    if: contains(github.event.head_commit.message, 'ci-build')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Capture the output: when the build fails, an ::error:: annotation makes
      # the reason visible in the API and in the run summary, instead of an
      # opaque "exit code 1".
      - name: Publish Linux build
        shell: bash
        run: |
          set -o pipefail
          npm run publish-linux 2>&1 | tee /tmp/linux-build.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::npm run publish-linux failed with exit code $status"
            tail -n 40 /tmp/linux-build.log | sed 's/^/  /'
          fi
          exit $status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-linux
          path: dist-electron/*.{deb,rpm,AppImage}
          if-no-files-found: warn
          retention-days: 14
