# Compiles the Glowing Eyes 26.3 port.
#
# WHY THIS LIVES AT THE REPO ROOT
# The port syncs from glowingeyes-26.3-port/, but a workflow inside that folder
# would sit at .github/workflows *within a subdirectory*, which GitHub never
# reads. Only the repository root counts. So this file stays here and points
# Gradle at the subdirectory with working-directory.
#
# WHAT THIS IS FOR
# The sandbox that produced the port has no route to maven.neoforged.net, so
# nothing in it has ever been compiled. This is the first real compile.
#
# EXPECT IT TO FAIL. That is the point: common/build.gradle still asks for
# neoFormVersion, and 26.x publishes no NeoForm. The failure message decides
# which of the two fix paths in PORT-26.3.md is right.
#
# THE ERROR DIGEST IS EMITTED AS ANNOTATIONS ON PURPOSE. Artifact downloads and
# raw logs are served from blob.core.windows.net, which some environments are
# not allowed to reach. Annotations come from the Checks API instead, so the
# reason for a failure stays readable from anywhere.
name: Glowing Eyes 26.3

on:
  push:
    branches: ['**']
    paths:
      - 'glowingeyes-26.3-port/**'
      - '.github/workflows/glowingeyes-26.3.yml'
  pull_request:
    paths:
      - 'glowingeyes-26.3-port/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.x needs Java 25, and Gradle itself has to run on it --
      # a Java 21 daemon cannot start a VERSION_25 toolchain.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Java version
        run: java -version 2>&1

      # set -o pipefail is load-bearing. Without it the exit status of
      # `./gradlew ... | tee` is tee's, which is always 0, and a failed build
      # reports success -- which is exactly what happened on the first run.
      - name: Build
        id: build
        working-directory: glowingeyes-26.3-port
        run: |
          set -o pipefail
          chmod +x ./gradlew
          # Gradle emits its own untitled ::error annotations, which render as bare
          # "cannot find symbol" with no file or context. Ours are the readable
          # ones, so Gradle's are suppressed here.
          ./gradlew build --stacktrace --continue --no-daemon \
            -Dorg.gradle.internal.github.actions.disabled=true 2>&1 | tee /tmp/gradle-build.log

      # Everything below is tuned so the *reason* for a failure fits inside an
      # annotation. Logs and artifacts are unreachable from some environments,
      # and an earlier attempt matched Gradle task names ("Task :buildSrc:...")
      # instead of the error, which told a reader nothing. So: find the
      # "What went wrong" block, strip Gradle's decorative characters, and put
      # that in the annotation itself.
      - name: Emit the error digest
        if: failure()
        run: |
          echo "=== why it failed ==="
          if [ ! -f /tmp/gradle-build.log ]; then
            echo "::error title=Build::no build log was produced"
            exit 0
          fi

          # Pull out the paragraph after "What went wrong", which is where
          # Gradle prints the actual cause, plus any Caused by line.
          ERR=$(awk '/^\* What went wrong:/{f=1;next} f&&/^\* Try:/{exit} f' /tmp/gradle-build.log \
                | sed 's/^[>-]* *//' | grep -v '^$' | head -12)
          CAUSE=$(grep -E "^Caused by:" /tmp/gradle-build.log | head -3)
          FIRST=$(grep -nE "> Could not |Could not resolve all|UnsupportedClassVersionError|Could not find |Could not create " /tmp/gradle-build.log | head -3)

          emit() {
            # ::error:: is one line; collapse newlines and escape % and CR.
            printf '%s' "$1" | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g' | cut -c1-900
          }

          # Every annotation must carry a non-empty title. GitHub renders a bare
          # "cannot find symbol" with no title as an unattributed error, which is
          # why an earlier run looked like it had failed with no reason at all.
          if [ -n "$ERR" ]; then
            echo "::error title=Gradle — what went wrong::$(emit "$ERR")"
          fi
          if [ -n "$CAUSE" ]; then
            echo "::error title=Gradle — caused by::$(emit "$CAUSE")"
          fi
          if [ -n "$FIRST" ]; then
            echo "::error title=Gradle — first error line::$(emit "$FIRST")"
          fi
          if [ -z "$ERR$CAUSE$FIRST" ]; then
            echo "::error title=Gradle — unclassified::$(emit "$(tail -25 /tmp/gradle-build.log)")"
          fi

          echo "--- last 30 lines, for the record ---"
          tail -30 /tmp/gradle-build.log || true

      # Compile errors are the ones that matter now, and a single ::error::
      # annotation truncates. This dedupes them: which distinct symbols are
      # missing, and how many files touch each. That is the work list for the
      # source port, in one place.
      - name: Summarise compile errors
        if: failure()
        run: |
          test -f /tmp/gradle-build.log || exit 0
          echo "=== distinct missing symbols ==="
          # "error: cannot find symbol" blocks name the symbol on a following line.
          # Only real compile errors: java's "symbol:" detail lines, excluding the
          # ones that are just echoed context.
          SYMS=$(grep -oE "symbol: +(class|variable|method|interface) [A-Za-z0-9_$.]+" /tmp/gradle-build.log \
                 | sed 's/symbol: *//' | sort | uniq -c | sort -rn | head -25)
          PKGS=$(grep -oE "package [a-z0-9_.]+ does not exist" /tmp/gradle-build.log \
                 | sort | uniq -c | sort -rn | head -12)
          NFILES=$(grep -cE "^[^:]+\\.java:[0-9]+: error:" /tmp/gradle-build.log || echo 0)
          ERRORS=$(grep -E "^[^:]+\\.java:[0-9]+: error:" /tmp/gradle-build.log | head -25)

          emit() { printf '%s' "$1" | tr '\n' ';' | sed 's/%/%25/g; s/\r//g' | cut -c1-850; }

          if [ -n "$SYMS" ]; then
            echo "::error title=Missing symbols (count name)::$(emit "$SYMS")"
          fi
          if [ -n "$PKGS" ]; then
            echo "::error title=Missing packages::$(emit "$PKGS")"
          fi
          if [ -n "$ERRORS" ]; then
            echo "::error title=First errors (${NFILES} lines)::$(emit "$ERRORS")"
          fi
          echo "--- symbols ---"; echo "$SYMS"
          echo "--- packages ---"; echo "$PKGS"
          echo "--- first errors ---"; echo "$ERRORS"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn

      - name: Upload the jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowingEyes-26.3-jars
          path: |
            glowingeyes-26.3-port/fabric/build/libs/*.jar
            glowingeyes-26.3-port/neoforge/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload compile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-reports
          path: |
            glowingeyes-26.3-port/**/build/reports/**
            glowingeyes-26.3-port/**/build/tmp/compileJava/**
          if-no-files-found: ignore
