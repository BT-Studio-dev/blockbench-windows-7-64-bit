name: Build resource packs

# Builds the Just Expressions + Fresh Moves glasses fix for every Minecraft
# Java version and uploads the zips. Runs on the same `ci-build` marker as the
# installer workflows so a normal push does not queue an extra job, and on any
# push that touches the pack source.
on:
  push:
    branches:
      - "**"
    paths:
      - "fresh-moves-glasses/pack-source/**"
      - "scripts/build_packs.mjs"
      - ".github/workflows/build-packs.yml"

jobs:
  build-packs:
    if: contains(github.event.head_commit.message, 'ci-build') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build packs for every version
        run: node scripts/build_packs.mjs dist-packs

      - name: Verify every pack is built against the vanilla hat plane
        run: node scripts/verify_packs.mjs dist-packs

      - name: Upload resource packs
        uses: actions/upload-artifact@v4
        with:
          name: just-expressions-fresh-moves-glasses
          path: dist-packs/*.zip
          if-no-files-found: error
