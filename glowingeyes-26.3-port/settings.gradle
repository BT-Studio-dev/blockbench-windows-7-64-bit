pluginManagement {
    // dev.architectury.loom has no plugin marker artifact, so the id has to be
    // redirected to the module that does exist. Without this, resolution fails
    // with "could not resolve plugin artifact
    // dev.architectury.loom:dev.architectury.loom.gradle.plugin:1.14.476"
    // no matter which repositories are declared.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'dev.architectury.loom') {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
        }
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri("https://maven.fabricmc.net")
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForge'
                    url = uri("https://maven.neoforged.net/releases")
                }
            }
            filter {
                includeGroupAndSubgroups("net.neoforged")
                includeGroup("codechicken")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri("https://maven.minecraftforge.net")
                }
            }
            filter {
                includeGroupAndSubgroups("net.minecraftforge")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge Snapshots'
                    url = uri("https://repo.spongepowered.org/repository/maven-public")
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'GlowingEyes'
include("common")
include("fabric")
include("neoforge")
