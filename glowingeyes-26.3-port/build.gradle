plugins {
    // see https://fabricmc.net/develop/ for new versions
    // 26.x has no mappings to remap against, so plain fabric-loom cannot work:
    // it refuses to configure without a mappings dependency, and the only
    // mappings to request (Mojang's obfuscation map) no longer exist. This is
    // the same wall the 26.3 branch of Reactions ran into, and the same plugin
    // gets past it.
    id 'dev.architectury.loom' version '1.14.476' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.140' apply false

    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

publishMods {
    changelog = getChangelogText()
    type = STABLE

    def fabricProject = project(":fabric")
    def neoforgeProject = project(":neoforge")

    def mcVersions = ["1.21.11"]

    def cfOptions = curseforgeOptions {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        projectId = "921929"
        projectSlug = "glowing-eyes"
        minecraftVersions.addAll(mcVersions)
    }

    def mrOptions = modrinthOptions {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = "9i2aYUyi"
        minecraftVersions.addAll(mcVersions)
    }

    curseforge("curseforgeFabric") {
        displayName = "${mod_id}-${fabricProject.name}-${minecraft_version}-${project.version}.jar"

        from cfOptions
        file(fabricProject)
        modLoaders.addAll("fabric", "quilt")
        requires {
            slug = "fabric-api"
        }
    }

    modrinth("modrinthFabric") {
        displayName = "[Fabric ${minecraft_version}] ${project.version}"

        from mrOptions
        file(fabricProject)
        modLoaders.addAll("fabric", "quilt")
        requires {
            slug = "fabric-api"
        }
    }

    curseforge("curseforgeNeoForge") {
        displayName = "${mod_id}-${neoforgeProject.name}-${minecraft_version}-${project.version}.jar"

        from cfOptions
        file(neoforgeProject)
        modLoaders.add("neoforge")
    }

    modrinth("modrinthNeoForge") {
        displayName = "[NeoForge ${minecraft_version}] ${project.version}"

        from mrOptions
        file(neoforgeProject)
        modLoaders.add("neoforge")
    }
}

def String getChangelogText() {
    def url = new URI("https://raw.githubusercontent.com/RaydanOMGr/GlowingEyes/refs/heads/changelogs/changelog-${version}.md").toURL()
    def connection = (HttpURLConnection)url.openConnection()
    connection.setRequestMethod("GET")
    connection.connect()

    def responseCode = connection.responseCode
    if (responseCode == 200) {
        return connection.inputStream.text
    } else {
        println("Failed to fetch version with error code ${responseCode}")
        return ""
    }
}