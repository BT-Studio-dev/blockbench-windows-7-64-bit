[package]
name = "blockbench-web7"
version = "0.1.0"
edition = "2021"
# Vercel's Rust runtime builds this crate in its own image, so pin the range
# here instead of relying on whatever `rustup default` happens to be.
rust-version = "1.85"
description = "Serves the Blockbench web build and its API from Vercel Functions"
license = "MIT"
publish = false

# Vercel's Rust runtime looks for `src/main.rs` and depends on the crate
# `vercel_runtime`. Both are what make the framework preset treat this as a
# Rust app and hand every non-static request to the binary below.
[dependencies]
vercel_runtime = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The handler returns hyper responses and reads request bodies through the
# http-body-util helpers, so both must be direct dependencies instead of
# relying on whatever the runtime happens to re-export.
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body = "1"
http-body-util = "0.1"
serde_json = "1"

# Release settings from the Vercel Rust docs: one codegen unit and fat LTO trade
# build time for a smaller, faster binary.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
